name: WordPress.org deployment preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.repository == 'Jahid07/woo-subscription-trial-coupon' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Install native SVN tools
        run: sudo apt-get update -qq && sudo apt-get install -y subversion rsync
      - name: Build production package
        run: npm run build
      - name: Check publication safeguards
        run: node --test tests/node/wordpress-publish.test.mjs
      - name: Prepare local SVN changes without publishing
        run: node scripts/preview-wordpress.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wordpress-org-preview
          path: |
            .cache/wordpress-org-preview/status.txt
            .cache/wordpress-org-preview/changes.diff
            .cache/wordpress-org-preview/summary.md
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error
