name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build package and inspect Plugin Check findings
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: composer lint:syntax
      - run: composer lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-review-package
          path: |
            dist/*.zip
            .cache/release-review-default/*.json
            .cache/release-review-default/*.txt
            .cache/release-review-default/summary.md
            .cache/browser-logs-default.json
            .cache/test-environment.json
            playwright-report/
            test-results/
          include-hidden-files: true
          if-no-files-found: error
